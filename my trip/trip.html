<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Booking</title>
    <link rel="stylesheet" href="trip.css">
</head>
<body>
    <header>
        <h1>Explore the World</h1>
        <p>Book your dream trip today!</p>
    </header>
    <main>
        <section id="destinations">
            
            <div class="destination">
                <img src="ladak.jpg" alt="Beach">
                <h2>Ladakh</h2>
                <p>Relax by the serene of snow and crystal-clear nature.</p>
                <button>Book Now</button>
            </div>
            <div class="destination">
                <img src="uttarakhand.jpg" alt="Mountain">
                <h2>Uttrakhand</h2>
                <p>Experience the breathtaking mountain landscapes and valleys.</p>
                <button>Book Now</button>
            </div>
            <div class="destination">
                <img src="kerela3.jpg"alt="City">
                <h2>Kerala</h2>
                <p>Explore the state of life and iconic landmarks and beauty.</p>
                <button>Book Now</button>
            </div>
        </section>
        
    </main>
    <footer>
        <p>&copy; 2024 Explore the World. All rights reserved.</p>
    </footer>
   
</body>
</html>
